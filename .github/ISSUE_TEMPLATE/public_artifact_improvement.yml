name: Public artifact improvement
description: Improve public documentation, examples, safe fixtures, metadata, or interoperability.
title: "[Artifact Improvement] "
labels: ["community", "good first issue"]
body:
  - type: markdown
    attributes:
      value: |
        Use this route for a concrete improvement to a public artifact. Questions and early ideas belong in Discussions.
  - type: input
    id: artifact
    attributes:
      label: Public artifact
      description: Link the page, repository, file, dataset, paper, schema, or demo.
      placeholder: https://mianzhang.org/community/
    validations:
      required: true
  - type: dropdown
    id: improvement_type
    attributes:
      label: Improvement type
      options:
        - Documentation or explanation
        - Link, citation, or metadata
        - Safe example or synthetic fixture
        - Schema, parser, or validator
        - Interoperability or adapter
        - Accessibility or language
        - Other public artifact repair
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Current problem
      description: Explain what a public user cannot understand, run, inspect, or connect today.
    validations:
      required: true
  - type: textarea
    id: proposed_change
    attributes:
      label: Proposed improvement
      description: Describe the smallest useful change and how another person can verify it.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Public release boundary
      options:
        - label: This issue contains only public, synthetic, or safely shareable information.
          required: true
        - label: This issue contains no credentials, customer data, private logs, private prompts, production parameters, or unreleased material.
          required: true
