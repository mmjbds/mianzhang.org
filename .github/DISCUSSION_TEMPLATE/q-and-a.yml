title: "[Question] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Ask a concrete question about a public paper, concept, benchmark, interface, or result. Do not include confidential or identifying data.
  - type: input
    id: artifact
    attributes:
      label: Relevant public artifact
      description: Link a paper, page, repository, dataset, demo, or discussion when available.
    validations:
      required: false
  - type: textarea
    id: question
    attributes:
      label: Question
      description: State what you are trying to understand or decide.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Public context
      description: Add only the non-confidential context needed to answer.
    validations:
      required: false
  - type: checkboxes
    id: boundary
    attributes:
      label: Sharing boundary
      options:
        - label: I have not included credentials, customer data, private logs, account records, or unreleased material.
          required: true
