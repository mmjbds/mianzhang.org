name: Community Surface Audit

on:
  pull_request:
    paths:
      - ".github/**"
      - "**/*.html"
      - "community/**"
      - "zh/community/**"
      - "scripts/audit_community_surface.py"
      - "scripts/audit_search_metadata.py"
      - "scripts/build_search_sitemap.py"
      - "LICENSE"
      - "OPEN_SOURCE_BOUNDARY.md"
      - "CONTENT_AND_MEDIA_LICENSE.md"
      - "COMMUNITY.md"
      - "GOVERNANCE.md"
      - "ROADMAP.md"
      - "README.md"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - "styles.css"
  push:
    branches: ["main"]
    paths:
      - ".github/**"
      - "**/*.html"
      - "community/**"
      - "zh/community/**"
      - "scripts/audit_community_surface.py"
      - "scripts/audit_search_metadata.py"
      - "scripts/build_search_sitemap.py"
      - "LICENSE"
      - "OPEN_SOURCE_BOUNDARY.md"
      - "CONTENT_AND_MEDIA_LICENSE.md"
      - "COMMUNITY.md"
      - "GOVERNANCE.md"
      - "ROADMAP.md"
      - "README.md"
      - "sitemap.xml"
      - "robots.txt"
      - "llms.txt"
      - "styles.css"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install YAML parser
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.2
      - name: Audit search metadata
        run: python scripts/audit_search_metadata.py
      - name: Verify search sitemap
        run: python scripts/build_search_sitemap.py --check
      - name: Audit community surface
        run: python scripts/audit_community_surface.py --self-test
