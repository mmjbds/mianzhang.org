name: public-ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit search metadata
        run: python scripts/audit_search_metadata.py
      - name: Audit reliability routes and internal links
        run: python scripts/audit_reliability_routes.py
      - name: Test search submission helpers
        run: python -m unittest discover -s scripts -p "test_*.py"
      - name: Validate ReflexBench browser data
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("demos/reflexbench-observer-depth/reflexbench.jsonl")
          rows = [json.loads(line) for line in path.read_text(encoding="utf-8").splitlines() if line.strip()]
          assert len(rows) == 20, len(rows)
          assert len({row["id"] for row in rows}) == 20
          assert all(all(part in row for part in ("part_a", "part_b", "part_c", "part_d")) for row in rows)
          PY
